<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Form Registrasi</title>
  </head>
  <body>
    <h1>Form Registrasi</h1>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required minlength="3" maxlength="20" />
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required pattern="^[^@]+@[^@]+\.[^@]+$" />
    <label for="age">Umur</label>
    <input id="age" name="age" type="number" min="18" max="65" />
    <label for="nickname">Nickname (opsional)</label>
    <input id="nickname" name="nickname" type="text" />
    <button id="submit-btn" type="submit">Daftar</button>
  </body>
</html>
